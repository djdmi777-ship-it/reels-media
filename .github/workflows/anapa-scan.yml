name: Anapa listings scan

on:
  # Рабочий сканер крутится на сервере (realty-parser/deploy, systemd-таймер).
  # Здесь только ручной запуск для отладки. Автозапуски отключены: тест и сервер ходят через один
  # прокси, и смена IP в тесте ломает проверку на сервере.
  workflow_dispatch:

concurrency:
  group: anapa-scan
  cancel-in-progress: ${{ github.event_name == 'push' }}  # новый тестовый пуш прерывает старый тест; расписание ждёт очереди

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_CHANNEL: chrome          # предустановленный на раннере Google Chrome
      BROWSER_PATH: /usr/bin/yandex-browser-stable   # Яндекс Браузер, если установился
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      TG_EXTRA_CHAT_IDS: "738632057"  # дополнительные получатели через запятую (тоже могут управлять поисками)
      # AVITO_PROXY_ROTATE_URL здесь намеренно не передаётся: смена IP в тесте сбивает сессии сервера
      AVITO_ROTATE_TRIES: "8"         # смена IP без ограничений: до 8 адресов за запуск
      AVITO_ROTATE_WAIT: "10"
      AVITO_PER_RUN: "0"              # все поиски Авито в каждом запуске (0 = без очереди)
      # >0 - один запуск крутится N минут с паузой LOOP_PAUSE между проверками
      LOOP_MINUTES: "0"
      LOOP_PAUSE: "840"               # пауза между проверками, с (+ ~1 мин сама проверка = ~15 мин)
      NO_JS: "0"                      # 1 - Авито без скриптов (проверено: чаще блок 429 и карточек нет - выключено)
      NO_BLOCK: "0"                   # экономия трафика: без рекламы, аналитики, картинок; если выдача не отрисуется - сам загрузит целиком
      AVITO_PROXY_URL: ${{ secrets.AVITO_PROXY_URL }}   # http://user:pass@host:port, пусто = Авито пропускается
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: realty-parser/requirements.txt
      - run: pip install -r realty-parser/requirements.txt

      - name: Install Yandex Browser
        continue-on-error: true       # не поставился - работаем на Google Chrome
        run: |
          curl -fsSL https://repo.yandex.ru/yandex-browser/YANDEX-BROWSER-KEY.GPG | sudo gpg --dearmor -o /usr/share/keyrings/yandex-browser.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/yandex-browser.gpg] https://repo.yandex.ru/yandex-browser/deb stable main" | sudo tee /etc/apt/sources.list.d/yandex-browser.list
          sudo apt-get update -o Dir::Etc::sourcelist=sources.list.d/yandex-browser.list -o Dir::Etc::sourceparts=- -o APT::Get::List-Cleanup=0
          sudo apt-get install -y --no-install-recommends yandex-browser-stable
          ls -l /usr/bin/yandex-browser* || true

      - name: Restore seen-listings state
        uses: actions/cache/restore@v4
        with:
          path: realty-parser/state
          key: anapa-state-${{ github.run_id }}
          restore-keys: anapa-state-

      - name: Scan
        run: |
          end=$((SECONDS + LOOP_MINUTES * 60))
          while true; do
            echo "=== Проверка $(TZ=Europe/Moscow date +%H:%M) МСК ==="
            # всегда --dry-run: без уведомлений клиентам и без записи базы (рабочая база - на сервере)
            python scanner.py --dry-run || echo "Проход завершился с ошибкой, продолжаю"
            [ "$SECONDS" -ge "$end" ] && break
            sleep "${LOOP_PAUSE:-300}"
          done
        working-directory: realty-parser

      - name: Save seen-listings state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: realty-parser/state
          key: anapa-state-${{ github.run_id }}
