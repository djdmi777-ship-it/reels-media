name: Anapa listings scan

on:
  schedule:
    # каждые 30 минут с 07:00 до 22:30 по Москве (UTC+3), ночью пауза: экономия бесплатных минут
    # GitHub. Время в cron - UTC. Запуск может запаздывать на 5-20 минут.
    - cron: "*/30 4-19 * * *"
  workflow_dispatch:
  push:                       # тестовые запуски из рабочей ветки
    branches: [claude/adoring-mendel-o29a8z]
    paths: ["realty-parser/**", ".github/workflows/anapa-scan.yml"]

concurrency:
  group: anapa-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHROME_CHANNEL: chrome          # предустановленный на раннере Google Chrome
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      AVITO_PROXY_URL: ${{ secrets.AVITO_PROXY_URL }}   # http://user:pass@host:port, пусто = Авито пропускается
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: realty-parser/requirements.txt
      - run: pip install -r realty-parser/requirements.txt

      - name: Restore seen-listings state
        uses: actions/cache/restore@v4
        with:
          path: realty-parser/state
          key: anapa-state-${{ github.run_id }}
          restore-keys: anapa-state-

      - name: Scan
        run: python scanner.py
        working-directory: realty-parser

      - name: Save seen-listings state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: realty-parser/state
          key: anapa-state-${{ github.run_id }}
