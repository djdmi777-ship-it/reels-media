name: Daily Prompt Generator

on:
  schedule:
    - cron: '0 8 * * *'  # каждый день в 08:00 UTC
  workflow_dispatch:       # ручной запуск через кнопку на GitHub

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests python-dotenv

      - name: Run prompt generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c "from prompt_generator import run_prompt_generator; run_prompt_generator()"
