<!doctype html>
<html><head><meta charset="utf-8"><title>AI models reel</title>
<style>
@font-face{font-family:Unb;src:url(fonts/unbounded-cyrillic.woff2),url(fonts/unbounded-latin.woff2);font-weight:200 900}
@font-face{font-family:Unb;src:url(fonts/unbounded-latin.woff2);unicode-range:U+0000-00FF;font-weight:200 900}
@font-face{font-family:Pf;src:url(fonts/playfair-display-cyrillic.woff2);unicode-range:U+0400-04FF;font-weight:400 900}
@font-face{font-family:Pf;src:url(fonts/playfair-display-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F;font-weight:400 900}
@font-face{font-family:PfI;src:url(fonts/playfair-display-italic-cyrillic.woff2);unicode-range:U+0400-04FF;font-weight:400 900}
@font-face{font-family:PfI;src:url(fonts/playfair-display-italic-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F;font-weight:400 900}
@font-face{font-family:It;src:url(fonts/inter-tight-cyrillic.woff2);unicode-range:U+0400-04FF;font-weight:100 900}
@font-face{font-family:It;src:url(fonts/inter-tight-latin.woff2);unicode-range:U+0000-00FF,U+2000-206F;font-weight:100 900}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block;width:1080px;height:1920px}
#hud{position:fixed;left:8px;top:8px;color:#0f0;font:14px monospace;z-index:9}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas><div id="hud"></div>
<script>
const W = 1080, H = 1920, FPS = 30;
const B = 60 / 154;                // one beat (track analysed: 154 BPM)
const bt = n => n * B;
const T = bt(80) + 0.5;             // film length
window.T = T;
const CREAM = '#f4ede3', ACC = '#ff5a36', INK = '#0a0909';
const CLIPS = { fire: 301, beach: 301, lips: 181, yoga: 241, dress: 301 };
const c = document.getElementById('c'), ctx = c.getContext('2d');

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lin = (t, a, b) => clamp((t - a) / (b - a));
const out3 = x => 1 - Math.pow(1 - x, 3);
const out5 = x => 1 - Math.pow(1 - x, 5);
const in3 = x => x * x * x;
const io = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const expo = x => x <= 0 ? 0 : x >= 1 ? 1 : 1 - Math.pow(2, -10 * x);
const mix = (a, b, p) => a + (b - a) * p;
// spring step response, damping ratio z >= .72 (tiny overshoot, no cartoon bounce)
function spring(t, f = 2.2, z = .76) {
  if (t <= 0) return 0;
  const w = 2 * Math.PI * f, wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

// ---------- frames ----------
const cache = new Map();
function frameIdx(clip, s) {
  const n = CLIPS[clip]; let i = Math.floor(s * FPS);
  const p = 2 * (n - 1); i = ((i % p) + p) % p; if (i >= n) i = p - i;   // ping-pong, never runs out
  return i + 1;
}
async function img(clip, s) {
  const k = clip + frameIdx(clip, s);
  if (cache.has(k)) return cache.get(k);
  const im = new Image(); im.src = `frames/${clip}/${String(frameIdx(clip, s)).padStart(4, '0')}.jpg`;
  await im.decode(); cache.set(k, im);
  if (cache.size > 120) cache.delete(cache.keys().next().value);
  return im;
}
// draw a source frame covering rect (x,y,w,h); zoom around focus (fx,fy in 0..1 of source)
async function vid(clip, s, x, y, w, h, o = {}) {
  const im = await img(clip, s);
  const z = o.zoom || 1, fx = o.fx ?? .5, fy = o.fy ?? .5;
  const ar = w / h; let sw = W, sh = W / ar; if (sh > H) { sh = H; sw = H * ar; }
  sw /= z; sh /= z;
  const sx = clamp(fx * W - sw / 2, 0, W - sw), sy = clamp(fy * H - sh / 2, 0, H - sh);
  ctx.save();
  if (o.filter) ctx.filter = o.filter;
  if (o.alpha != null) ctx.globalAlpha = o.alpha;
  ctx.drawImage(im, sx, sy, sw, sh, x, y, w, h);
  ctx.restore();
}

// ---------- type ----------
function font(fam, size, wt = 800) { return `${wt} ${size}px ${fam}`; }
// masked rise: text slides up from behind its own baseline mask
function rise(str, f, x, y, p, o = {}) {
  ctx.save(); ctx.font = f; ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'alphabetic';
  if (o.track) ctx.letterSpacing = o.track + 'px';
  const m = ctx.measureText(str), asc = m.actualBoundingBoxAscent, desc = m.actualBoundingBoxDescent;
  const wdt = m.width; const left = o.align === 'left' ? x : o.align === 'right' ? x - wdt : x - wdt / 2;
  ctx.beginPath(); ctx.rect(left - 40, y - asc - 12, wdt + 80, asc + desc + 24); ctx.clip();
  const h = asc + desc + 20;
  ctx.translate(0, (1 - out5(p)) * h);
  if (o.rot) ctx.rotate((1 - out5(p)) * o.rot);
  ctx.globalAlpha = o.alpha ?? 1;
  ctx.fillStyle = o.color || CREAM;
  if (o.track) ctx.letterSpacing = o.track + 'px';
  if (o.shadow) { ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 30; }
  ctx.fillText(str, x, y);
  ctx.restore();
}
// word by word rise, 55 ms stagger
function words(str, f, x, y, t0, t, o = {}) {
  ctx.save(); ctx.font = f; if (o.track) ctx.letterSpacing = o.track + 'px';
  const ws = str.split(' '); const sp = ctx.measureText(' ').width;
  const widths = ws.map(w => ctx.measureText(w).width); const tot = widths.reduce((a, b) => a + b, 0) + sp * (ws.length - 1);
  ctx.restore();
  let cx = (o.align === 'left') ? x : x - tot / 2;
  ws.forEach((w, i) => { rise(w, f, cx, y, lin(t, t0 + i * .055, t0 + i * .055 + .5), { ...o, align: 'left', rot: .04 }); cx += widths[i] + sp; });
}
function label(str, x, y, a = 1, o = {}) {
  ctx.save(); ctx.font = font('It', o.size || 30, 600); ctx.letterSpacing = (o.track ?? 6) + 'px';
  ctx.textAlign = o.align || 'left'; ctx.fillStyle = o.color || CREAM; ctx.globalAlpha = a;
  ctx.fillText(str, x, y); ctx.restore();
}

// ---------- film texture ----------
const layer = document.createElement('canvas'); layer.width = W; layer.height = H;
const grain = document.createElement('canvas'); grain.width = grain.height = 512;
{ const g = grain.getContext('2d'), d = g.createImageData(512, 512), r = mulberry(7);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; }
  g.putImageData(d, 0, 0); }
function texture(t) {
  const f = Math.round(t * FPS), r = mulberry(f * 13 + 1);
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = .07;
  const ox = -r() * 512, oy = -r() * 512;
  for (let x = ox; x < W; x += 512) for (let y = oy; y < H; y += 512) ctx.drawImage(grain, x, y);
  ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}
function shade(a, col = '0,0,0') { ctx.fillStyle = `rgba(${col},${a})`; ctx.fillRect(0, 0, W, H); }
function grad(y0, y1, a) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, `rgba(0,0,0,${a})`); ctx.fillStyle = g; ctx.fillRect(0, Math.min(y0, y1), W, Math.abs(y1 - y0)); }

// beat punch after the drop: +1.5 % per beat, exp decay
function punch(t) {
  if (t < bt(16)) return 1;
  const k = Math.floor(t / B), dt = t - k * B;
  return 1 + .015 * Math.exp(-dt * 9) + (k % 4 === 0 ? .01 * Math.exp(-dt * 7) : 0);
}
// chapter tag: "01 / 05  SWIMWEAR"
function chapter(n, name, t, t0) {
  { const g = ctx.createLinearGradient(0, 0, 0, 420); g.addColorStop(0, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, 420); }
  const p = lin(t, t0 + .05, t0 + .45);
  ctx.save(); ctx.globalAlpha = out3(p);
  ctx.fillStyle = ACC; ctx.fillRect(72, 168, out3(p) * 64, 6);
  ctx.restore();
  rise(`0${n} / 05`, font('It', 30, 600), 72, 238, p, { align: 'left', track: 6 });
  rise(name, font('Unb', 46, 800), 72, 300, lin(t, t0 + .12, t0 + .55), { align: 'left', shadow: 1 });
}
// whip transition: incoming scene enters from below already moving; blur scales with speed
function whipOffset(t, t0, dir = 1) { const p = lin(t, t0, t0 + .22); return dir * (1 - out5(p)) * H * .9; }

// ======================= SCENES =======================
const SC = [];
const scene = (a, b, fn) => SC.push({ a: bt(a), b: bt(b), fn });

// S0 hook 0-8 beats: lips, "ЕЁ НЕ СУЩЕСТВУЕТ"
scene(0, 8, async (t) => {
  const z = mix(1.12, 1.0, out3(lin(t, 0, bt(8))));
  await vid('lips', 0.6 + t * .9, 0, 0, W, H, { zoom: z, fy: .45 });
  shade(.25); grad(H * .45, H, .85);
  label('СГЕНЕРИРОВАНО НЕЙРОСЕТЬЮ', W / 2, 150, out3(lin(t, .1, .5)) * .85, { align: 'center', size: 26, track: 8 });
  rise('ЕЁ НЕ', font('Unb', 150, 900), W / 2, 1380, lin(t, .12, .6));
  rise('существует', font('PfI', 150, 700), W / 2, 1560, lin(t, .38, .9), { color: CREAM });
  // accent underline that draws on beat 4
  const u = out5(lin(t, bt(4), bt(4) + .35));
  ctx.fillStyle = ACC; ctx.fillRect(W / 2 - 300 * u, 1610, 600 * u, 8);
});

// S1 8-16: "и их тоже" faces flicker in a growing window, half-beat flicker in last bar
const FLICK = ['fire', 'beach', 'yoga', 'dress'];
scene(8, 16, async (t) => {
  const t0 = bt(8), k = Math.floor((t - t0) / B), half = t > bt(14);
  const idx = half ? Math.floor((t - t0) / (B / 2)) : k;
  const clip = FLICK[idx % 4];
  await vid(clip, 1 + (t - t0), 0, 0, W, H, { zoom: 1.3, filter: 'blur(40px) brightness(.35)' });
  const g = mix(.5, .74, in3(lin(t, t0, bt(16))));
  const local = t - (t0 + (half ? idx * B / 2 : k * B));
  const pop = 1 + .05 * Math.exp(-local * 14);
  const w = W * g * pop, h = w * 1.4, x = (W - w) / 2, y = (H - h) / 2 + 90;
  ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.clip();
  await vid(clip, 1.5 + (t - t0), x, y, w, h, { zoom: 1.05, fy: .32 });
  ctx.restore();
  ctx.strokeStyle = 'rgba(244,237,227,.6)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.roundRect(x, y, w, h, 28); ctx.stroke();
  words('и их тоже', font('PfI', 120, 700), W / 2, 330, t0 + .05, t);
  // counter of models shown
  label(String(Math.min(idx + 1, 99)).padStart(2, '0'), x + 24, y + h - 28, .9, { size: 34, track: 2 });
  // flash into the drop
  const fl = lin(t, bt(16) - .08, bt(16));
  if (fl > 0) shade(fl, '244,237,227');
});

// S2 drop 16-24: "AI" filled with the dress walk, then zoom through the letters
scene(16, 24, async (t) => {
  const t0 = bt(16);
  const through = expo(lin(t, bt(20.5), bt(22.5)));      // camera flies through the gap
  const s = 1 + through * 22;
  // full video revealed behind (dims while letters are solid)
  await vid('dress', t - t0 + .3, 0, 0, W, H, { zoom: 1.04 });
  ctx.save();
  ctx.fillStyle = INK; ctx.globalAlpha = 1 - out3(lin(t, bt(21), bt(22.5)));
  ctx.fillRect(0, 0, W, H); ctx.restore();
  // letters as a window into the clip
  const L = layer.getContext('2d');
  L.setTransform(1, 0, 0, 1, 0, 0); L.globalCompositeOperation = 'source-over'; L.clearRect(0, 0, W, H);
  const sp = spring(t - t0, 2.4, .78), ls = mix(.8, 1, sp);
  L.translate(W / 2, 1000); L.scale(s * ls, s * ls); L.translate(-W / 2, -1000);
  L.font = font('Unb', 470, 900); L.textAlign = 'center'; L.textBaseline = 'middle';
  L.fillStyle = '#fff'; L.fillText('AI', W / 2, 1000);
  L.setTransform(1, 0, 0, 1, 0, 0); L.globalCompositeOperation = 'source-in';
  const im = await img('dress', t - t0 + .3); L.drawImage(im, -W * .15, 1000 - 560 * 1.3, W * 1.3, H * 1.3);
  ctx.save(); ctx.globalAlpha = 1 - lin(t, bt(21.5), bt(22.5)); ctx.drawImage(layer, 0, 0); ctx.restore();
  // line under, appears beat 17
  if (through < .05) {
    rise('модели', font('PfI', 132, 700), W / 2, 1500, lin(t, bt(17), bt(17) + .5));
    rise('ДЛЯ ВАШЕГО БРЕНДА', font('It', 40, 700), W / 2, 1590, lin(t, bt(18), bt(18) + .5), { track: 10 });
  }
  if (t > bt(22.5)) { grad(H * .6, H, .7); rise('Любой образ. Любая локация.', font('PfI', 64, 600), W / 2, 1640, lin(t, bt(22.5), bt(23.2))); }
});

// C1 24-32 yoga: three strips with time offsets, middle one opens to full frame
scene(24, 32, async (t) => {
  const t0 = bt(24), oy = whipOffset(t, t0);
  ctx.save(); ctx.translate(0, oy);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const open = io(lin(t, bt(28), bt(29.5)));
  const gap = mix(18, 0, open);
  for (let i = 0; i < 3; i++) {
    const enter = spring(t - t0 - i * .09, 2.2, .8);
    const dir = i % 2 ? -1 : 1;
    let w = (W - gap * 4) / 3, x = gap + i * (w + gap);
    if (i === 1) { x = mix(x, 0, open); w = mix(w, W, open); }
    else { x += (i === 0 ? -1 : 1) * open * W * .5; }
    const y = (1 - enter) * dir * H;
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, H); ctx.clip();
    await vid('yoga', (t - t0) + i * 1.4, x, y, w, H, { zoom: 1, fx: .5 });
    ctx.restore();
  }
  ctx.restore();
  grad(H * .55, H, .75);
  chapter(1, 'СПОРТ И ЛАЙФСТАЙЛ', t, t0);
  words('Йога, фитнес, бег. Любой вид спорта.', font('PfI', 56, 600), W / 2, 1700, bt(29), t);
});

// C2 32-40 beach: card in front of a giant word, blurred world behind
scene(32, 40, async (t) => {
  const t0 = bt(32), oy = whipOffset(t, t0);
  ctx.save(); ctx.translate(0, oy);
  await vid('beach', 1 + t - t0, 0, 0, W, H, { zoom: 1.25, filter: 'blur(30px) brightness(.55) saturate(1.2)' });
  // giant word behind the card, slides slowly
  ctx.save(); ctx.font = font('Unb', 330, 900); ctx.textAlign = 'center'; ctx.fillStyle = CREAM;
  ctx.globalAlpha = .95 * out3(lin(t, t0, t0 + .4));
  const drift = (t - t0) * 40;
  ctx.fillText('SWIM', W / 2 - 40 + drift, 640); ctx.fillText('WEAR', W / 2 + 40 - drift, 1760);
  ctx.restore();
  const sp = spring(t - t0 - .08, 1.8, .78);
  const w = 600, h = 900, cx = W / 2, cy = 1060;
  ctx.save(); ctx.translate(cx, cy + (1 - sp) * 500); ctx.rotate((1 - sp) * .12 - .025); ctx.scale(mix(.85, 1, sp), mix(.85, 1, sp));
  ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 60; ctx.shadowOffsetY = 30;
  ctx.fillStyle = CREAM; ctx.fillRect(-w / 2 - 16, -h / 2 - 16, w + 32, h + 110);
  ctx.shadowColor = 'transparent';
  ctx.beginPath(); ctx.rect(-w / 2, -h / 2, w, h); ctx.clip();
  await vid('beach', .4 + t - t0, -w / 2, -h / 2, w, h, { zoom: 1.02, fy: .45 });
  ctx.restore();
  ctx.save(); ctx.translate(cx, cy + (1 - sp) * 500); ctx.rotate((1 - sp) * .12 - .025);
  ctx.font = font('PfI', 44, 600); ctx.fillStyle = INK; ctx.textAlign = 'left'; ctx.fillText('golden hour, Бали', -w / 2 + 6, h / 2 + 66);
  ctx.restore();
  ctx.restore();
  chapter(2, 'КУПАЛЬНИКИ', t, t0);
});

// C3 40-48 fire: horizontal blinds slide in from alternating sides, then lock
scene(40, 48, async (t) => {
  const t0 = bt(40), N = 6, bh = H / N;
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < N; i++) {
    const p = out5(lin(t, t0 + i * .045, t0 + i * .045 + .42));
    const dir = i % 2 ? 1 : -1, x = (1 - p) * dir * W;
    const lag = (1 - lin(t, t0, bt(44))) * .25 * (i % 2 ? 1 : -1);   // bands drift in time, then sync
    ctx.save(); ctx.beginPath(); ctx.rect(0, i * bh, W, bh + 1); ctx.clip();
    ctx.translate(x, 0);
    await vid('fire', .5 + (t - t0) + lag, 0, 0, W, H, { zoom: mix(1.15, 1.03, out3(lin(t, t0, bt(48)))), fy: .4 });
    ctx.restore();
  }
  // seam lines fade once bands lock
  ctx.save(); ctx.globalAlpha = 1 - lin(t, bt(43), bt(44));
  ctx.fillStyle = INK; for (let i = 1; i < N; i++) ctx.fillRect(0, i * bh - 2, W, 4); ctx.restore();
  grad(H * .55, H, .75);
  chapter(3, 'БЕЛЬЁ', t, t0);
  words('Камерный свет, интерьер, настроение.', font('PfI', 56, 600), W / 2, 1700, bt(45), t);
});

// C4 48-56 lips: iris opens from the centre, ring follows on its own spring
scene(48, 56, async (t) => {
  const t0 = bt(48);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const r = mix(140, 420, spring(t - t0, 2.2, .8));
  const grow = expo(lin(t, bt(53), bt(55)));
  const R = mix(r, Math.hypot(W, H) * .55, grow);
  ctx.save(); ctx.beginPath(); ctx.arc(W / 2, 900, Math.max(R, 1), 0, Math.PI * 2); ctx.clip();
  { const z = mix(1.6, 1.25, out3(lin(t, t0, bt(56)))), im = await img('lips', 2.2 + (t - t0) * .8);
    ctx.drawImage(im, W / 2 - W * z / 2, 900 - 300 * z, W * z, H * z); }
  ctx.restore();
  const rr = mix(0, 452, spring(t - t0 - .06, 1.3, .78));
  ctx.save(); ctx.globalAlpha = 1 - grow; ctx.strokeStyle = ACC; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(W / 2, 900, Math.max(rr, 1), -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * out3(lin(t, t0, t0 + 1.2))); ctx.stroke(); ctx.restore();
  ctx.save(); ctx.globalAlpha = 1 - grow;
  words('кожа · макияж · детали', font('PfI', 62, 600), W / 2, 1540, bt(50), t);
  ctx.restore();
  if (grow > .5) grad(H * .55, H, .7);
  chapter(4, 'БЬЮТИ И КРУПНЫЕ ПЛАНЫ', t, t0);
});

// C5 56-64 dress: cinemascope bars close in, film look, serif title
scene(56, 64, async (t) => {
  const t0 = bt(56), oy = whipOffset(t, t0, -1);
  ctx.save(); ctx.translate(0, oy);
  { const z = mix(1.0, 1.14, io(lin(t, t0, bt(64)))), bars = out5(lin(t, bt(57), bt(58)));
    const fy = -mix(0, 560, bars);   // as the bars close, lift the face into the 2.39 strip
    const im = await img('dress', 4 + (t - t0));
    ctx.save(); ctx.filter = 'contrast(1.06) saturate(.9) sepia(.12)';
    ctx.drawImage(im, W / 2 - W * z / 2, H / 2 - H * z / 2 - fy * z, W * z, H * z); ctx.restore(); }
  ctx.restore();
  const bar = out5(lin(t, bt(57), bt(58))) * 520;
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, bar); ctx.fillRect(0, H - bar, W, bar);
  chapter(5, 'ВЕЧЕРНИЙ ОБРАЗ', t, t0);
  rise('бал, свадьба, red carpet', font('PfI', 60, 600), W / 2, H - 300, lin(t, bt(58.5), bt(59.2)));
});

// S8 64-72 mosaic: 2x3 grid, tiles land one per half beat, camera pulls out
const TILES = ['fire', 'beach', 'yoga', 'dress', 'lips', 'TEXT'];
scene(64, 72, async (t) => {
  const t0 = bt(64);
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const cam = mix(1.25, 1, out3(lin(t, t0, bt(70))));
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(cam, cam); ctx.translate(-W / 2, -H / 2);
  const g = 14, tw = (W - g * 3) / 2, th = (H - 260 - g * 4) / 3;
  for (let i = 0; i < 6; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const x = g + col * (tw + g), y = 130 + g + row * (th + g);
    const p = spring(t - t0 - i * B / 2, 2.4, .8);
    if (p <= 0) continue;
    ctx.save(); ctx.translate(x + tw / 2, y + th / 2); ctx.scale(mix(.6, 1, p), mix(.6, 1, p)); ctx.globalAlpha = clamp(p * 1.6);
    ctx.beginPath(); ctx.roundRect(-tw / 2, -th / 2, tw, th, 22); ctx.clip();
    if (TILES[i] === 'TEXT') {
      ctx.fillStyle = ACC; ctx.fillRect(-tw / 2, -th / 2, tw, th);
      ctx.fillStyle = INK; ctx.textAlign = 'center'; ctx.font = font('Unb', 60, 900);
      ctx.fillText('ТВОЯ', 0, -10); ctx.fillText('МОДЕЛЬ', 0, 66);
    } else await vid(TILES[i], 1 + (t - t0) + i * .3, -tw / 2, -th / 2, tw, th, { zoom: 1.05, fy: .35 });
    ctx.restore();
  }
  ctx.restore();
  const tp = lin(t, bt(68), bt(68) + .5);
  ctx.save(); ctx.globalAlpha = out3(tp); ctx.fillStyle = 'rgba(10,9,9,.78)'; ctx.fillRect(0, H / 2 - 120, W, 210); ctx.restore();
  words('фото · видео · рилс', font('PfI', 96, 700), W / 2, H / 2 + 20, bt(68), t);
  rise('ПОД КЛЮЧ', font('It', 34, 700), W / 2, H / 2 + 72, lin(t, bt(69), bt(69) + .5), { track: 12, color: ACC });
});

// S9 72-80 CTA
scene(72, 80.5 + 0.5 / B, async (t) => {
  const t0 = bt(72);
  await vid('fire', 5 + (t - t0) * .7, 0, 0, W, H, { zoom: 1.15, filter: 'blur(26px) brightness(.32)' });
  const fin = lin(t, t0, t0 + .3); if (fin < 1) shade(1 - fin, '10,9,9');
  words('Сделаю такой контент', font('PfI', 84, 700), W / 2, 760, t0 + .05, t);
  words('для вашего бренда', font('PfI', 84, 700), W / 2, 870, t0 + .3, t);
  const bp = spring(t - bt(74), 2, .78);
  if (bp > 0) {
    ctx.save(); ctx.translate(W / 2, 1100); ctx.scale(mix(.7, 1, bp), mix(.7, 1, bp)); ctx.globalAlpha = clamp(bp * 1.5);
    ctx.fillStyle = ACC; ctx.beginPath(); ctx.roundRect(-400, -90, 800, 180, 90); ctx.fill();
    ctx.fillStyle = INK; ctx.font = font('Unb', 64, 900); ctx.textAlign = 'center'; ctx.fillText('ПИШИ В ДИРЕКТ', 0, 24);
    ctx.restore();
  }
  ctx.save(); ctx.globalAlpha = out3(lin(t, bt(76), bt(77))) * .75;
  label('все модели на видео созданы нейросетью', W / 2, 1720, 1, { align: 'center', size: 26, track: 3 }); ctx.restore();
});

let lastT = -1;
window.seek = async (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none'; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = INK; ctx.fillRect(0, 0, W, H);
  const s = SC.find(s => t >= s.a && t < s.b) || SC[SC.length - 1];
  const p = punch(t);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(p, p); ctx.translate(-W / 2, -H / 2);
  await s.fn(t);
  ctx.restore();
  texture(t);
  lastT = t;
  document.getElementById('hud').textContent = location.search.includes('hud') ? `${t.toFixed(2)}s  beat ${(t / B).toFixed(1)}` : '';
};
window.frameJPEG = async (t) => { await window.seek(t); return c.toDataURL('image/jpeg', .93); };

// preview: Space play/pause, arrows step a frame
let playing = false, t0 = 0, start = 0;
addEventListener('keydown', e => {
  if (e.code === 'Space') { playing = !playing; start = performance.now() - lastT * 1000; if (playing) loop(); }
  if (e.code === 'ArrowRight') seek(lastT + 1 / FPS); if (e.code === 'ArrowLeft') seek(Math.max(0, lastT - 1 / FPS));
});
async function loop() { if (!playing) return; await seek(((performance.now() - start) / 1000) % T); requestAnimationFrame(loop); }
document.fonts.ready.then(async () => {
  await Promise.all(['900 10px Unb', '700 10px PfI', '700 10px Pf', '600 10px It'].map(f => document.fonts.load(f, 'АБВ AI')));
  await seek(0); window.ready = true;
});
